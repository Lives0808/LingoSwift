name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    env:
      VERSION: 1.0.1
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build, sign and package
        run: ./Scripts/package.sh

      - name: Upload DMG and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LingoSwift-${{ env.VERSION }}
          path: |
            build/LingoSwift-${{ env.VERSION }}.dmg
            build/LingoSwift-${{ env.VERSION }}.zip
            build/SHA256SUMS.txt
          if-no-files-found: error
